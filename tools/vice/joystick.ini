; Réglages VICE ajoutés par tools/run.sh (-default -addconfig) :
; joystick du port 2 = jeu de touches 1 du clavier de l'ordinateur.
; Flèches = directions, espace = tir (codes de touche GDK : Left 65361,
; Up 65362, Right 65363, Down 65364, space 32). Ces touches vont alors au
; joystick seulement : le clavier du C64 ne les voit plus.
[C64SC]
JoyDevice2=2
KeySetEnable=1
KeySet1North=65362
KeySet1South=65364
KeySet1West=65361
KeySet1East=65363
KeySet1Fire=32
